<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f8ff"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="36" font-weight="bold" fill="#2e8b57">
    BioSync Smart Garden - System Architecture
  </text>
  
  <!-- Smart Control Hub -->
  <rect x="450" y="100" width="300" height="150" 
        fill="#32cd32" stroke="#1a8917" stroke-width="3" rx="15"/>
  <text x="600" y="180" text-anchor="middle" font-size="24" fill="white">
    Smart Control Hub
  </text>
  
  <!-- Environmental Management -->
  <rect x="100" y="300" width="300" height="250" 
        fill="#90ee90" stroke="#32cd32" stroke-width="2" rx="15"/>
  <text x="250" y="330" text-anchor="middle" font-size="20" fill="#006400">
    Environmental Management
  </text>
  <text x="250" y="380" text-anchor="middle" font-size="16" fill="#006400">
    • Climate Control
    • Light Management
    • Water Circulation
  </text>
  
  <!-- Nutrient Management -->
  <rect x="800" y="300" width="300" height="250" 
        fill="#90ee90" stroke="#32cd32" stroke-width="2" rx="15"/>
  <text x="950" y="330" text-anchor="middle" font-size="20" fill="#006400">
    Nutrient Management
  </text>
  <text x="950" y="380" text-anchor="middle" font-size="16" fill="#006400">
    • Nutrient Mixing
    • Delivery System
    • Nutrient Monitoring
  </text>
  
  <!-- Sensor Network -->
  <rect x="450" y="600" width="300" height="150" 
        fill="#98fb98" stroke="#32cd32" stroke-width="2" rx="15"/>
  <text x="600" y="650" text-anchor="middle" font-size="20" fill="#006400">
    Smart Sensor Network
  </text>
  <text x="600" y="690" text-anchor="middle" font-size="16" fill="#006400">
    • Temperature Sensors
    • Humidity Sensors
    • pH Sensors
  </text>
  
  <!-- Connections -->
  <line x1="600" y1="250" x2="250" y2="300" stroke="#1a8917" stroke-width="3"/>
  <line x1="600" y1="250" x2="950" y2="300" stroke="#1a8917" stroke-width="3"/>
  <line x1="600" y1="250" x2="600" y2="600" stroke="#1a8917" stroke-width="3"/>
  
  <!-- User Interface -->
  <rect x="800" y="600" width="300" height="150" 
        fill="#006400" stroke="#004d00" stroke-width="2" rx="15"/>
  <text x="950" y="670" text-anchor="middle" font-size="20" fill="white">
    User Interface
  </text>
  <text x="950" y="710" text-anchor="middle" font-size="16" fill="white">
    • Mobile App
    • Web Dashboard
    • Alerts
  </text>
</svg>