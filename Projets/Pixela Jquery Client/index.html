<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixela jQuery Client</title>
    
    <!-- Inclusion des feuilles de style Bootstrap et Water.css pour une meilleure mise en page -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    
    <!-- Inclusion de jQuery et du fichier app.js qui contient la logique du client -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
    <script src="app.js" defer></script>
    
    <style>
        /* Styles généraux de la page */
        body {
            margin: 0 auto;
            max-width: 50em;
            padding: 1em;
        }
        img {
            max-width: 100%;
        }
        a, a:visited {
            color: blue;
        }
        /* Masquer certaines sections par défaut */
        #dashboard, #graph-section {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Pixela jQuery Client</h1>

        <!-- Section d'authentification (Connexion/Inscription) -->
        <div id="auth-section">
            <h2>Connexion / Inscription</h2>
            <form id="auth-form">
                <input type="text" id="username" class="form-control my-2" placeholder="Nom d'utilisateur" required>
                <input type="password" id="token" class="form-control my-2" placeholder="Mot de passe" required>
                <button type="submit" class="btn btn-primary">Se connecter</button>
                <button type="button" id="register" class="btn btn-secondary">S'inscrire</button>
            </form>
        </div>

        <!-- Tableau de bord après connexion -->
        <div id="dashboard">
            <button id="logout" class="btn btn-danger my-3">Déconnexion</button>

            <!-- Section pour créer un nouveau graphe -->
            <h2>Gestion des Graphes</h2>
            <form id="create-graph-form">
                <input type="text" id="graph-id" class="form-control my-2" placeholder="ID du graphe" required>
                <input type="text" id="graph-name" class="form-control my-2" placeholder="Nom du graphe" required>
                <button type="submit" class="btn btn-success">Créer un graphe</button>
            </form>

            <!-- Liste des graphes existants -->
            <h3>Vos graphes :</h3>
            <ul id="graphs-list" class="list-group"></ul>
        </div>

        <!-- Section d'ajout / suppression de pixels -->
        <div id="graph-section">
            <h2>Ajout / Suppression de Pixels</h2>
            <input type="date" id="pixel-date" class="form-control my-2">
            <input type="number" id="pixel-value" class="form-control my-2" placeholder="Valeur du pixel">
            <button id="add-pixel" class="btn btn-success">Ajouter un pixel</button>
            <button id="delete-pixel" class="btn btn-danger">Supprimer un pixel</button>
        </div>

        <!-- Section pour afficher un graphe spécifique -->
        <div id="graph-section" style="display: none;">
            <h2>Graphes</h2>
            <input type="text" id="graph-id" class="form-control my-2" placeholder="ID du graphe">
            <button id="show-graph" class="btn btn-success">Afficher le graphe</button>
            <div id="graph-container" class="mt-3"></div>
        </div>
    </div>
</body>
</html>
